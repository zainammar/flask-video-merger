<!DOCTYPE html>
<html>
<head>
    <title>Video Merger</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .file-box {
            border: 2px dashed #aaa;
            padding: 20px;
            margin-bottom: 20px;
        }

        .file-item {
            margin: 8px auto;
            padding: 10px;
            background: #f2f2f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80%;
            border-radius: 6px;
        }

        .progress {
            width: 80%;
            margin: 20px auto;
            background: #ddd;
            border-radius: 10px;
        }

        .bar {
            width: 0%;
            height: 30px;
            background: green;
            color: white;
            text-align: center;
            line-height: 30px;
            border-radius: 10px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 70px;
        }
    </style>
</head>
<body>

<h2>🎬 Video Merger</h2>

<div class="file-box">
    <input type="file" id="fileInput" multiple>
</div>

<div id="fileList"></div>

<button onclick="startUpload()">Merge Videos</button>

<div class="progress">
    <div class="bar" id="bar">0%</div>
</div>

<p id="status"></p>

<video id="preview" controls style="display:none; width:400px;"></video>
<br><br>

<a id="downloadBtn" style="display:none;" target="_blank">Download Merged Video</a>

<script>
let filesArray = [];

const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const bar = document.getElementById('bar');
const status = document.getElementById('status');

fileInput.addEventListener('change', function () {
    const newFiles = Array.from(this.files);
    filesArray = filesArray.concat(newFiles);
    renderList();
    this.value = "";
});

function renderList() {
    fileList.innerHTML = "";

    filesArray.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'file-item';

        div.innerHTML = `
            <div style="text-align:left;">
                <b>${file.name}</b><br>

                ⏱ Start:
                <input type="number" step="0.1" min="0" id="start_${index}" value="0">

                ⏱ End:
                <input type="number" step="0.1" min="0" id="end_${index}" value="0">
            </div>

            <button onclick="removeFile(${index})">❌</button>
        `;

        fileList.appendChild(div);
    });
}

function removeFile(index) {
    filesArray.splice(index, 1);
    renderList();
}

function startUpload() {
    if (filesArray.length === 0) {
        alert("Please select videos!");
        return;
    }

    const formData = new FormData();

    filesArray.forEach((file, index) => {
        formData.append('videos', file);

        const start = document.getElementById(`start_${index}`).value || 0;
        const end = document.getElementById(`end_${index}`).value || 0;

        formData.append(`start_${index}`, start);
        formData.append(`end_${index}`, end);
    });

    status.innerText = "Uploading & Processing...";

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        status.innerText = "Merge Completed ✅";

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = data.download;
        downloadBtn.style.display = "inline-block";
        downloadBtn.innerText = "Download Video";

        trackProgress();
    })
    .catch(err => {
        console.error(err);
        status.innerText = "Error occurred ❌";
    });
}

function trackProgress() {
    setInterval(() => {
        fetch('/progress')
        .then(res => res.json())
        .then(data => {
            bar.style.width = data.percent + "%";
            bar.innerText = data.percent + "%";
        });
    }, 1000);
}
</script>

</body>
</html>
